services:
  backend:
    build: 
      context: .
      dockerfile: homeIntelli/app/backend/Dockerfile
    container_name: fastapi_backend
    ports:
      - "8000:8000"
    depends_on:
      - mosquitto
    environment:
      MQTT_BROKER_HOST: mosquitto 
      MQTT_BROKER_PORT: 1883
      MQTT_USERNAME: fastapi_user 
      MQTT_PASSWORD: fastapi_password
    volumes:
      - ./homeIntelli/app/backend:/app 
    networks:
      - iot_net

  simulations:
    build: 
      context: .
      dockerfile: homeIntelli/app/simulations/Dockerfile
    container_name: iot_simulation
    volumes:
      - ./homeIntelli/app/simulations:/app 
    networks:
      - iot_net

  mosquitto:
    container_name: mosquitto_broker
    image: eclipse-mosquitto:2.0.15
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto/passwd:/mosquitto/config/passwd
      - ./mosquitto/acl.conf:/mosquitto/config/acl.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped
    networks:
      - iot_net

networks:
  iot_net:
    driver: bridge

volumes:
  mosquitto_data:
  mosquitto_log: